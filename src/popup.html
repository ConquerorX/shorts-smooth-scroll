<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        width: 276px;
        margin: 0;
        padding: 14px 16px 16px;
        background: #0f0f0f;
        color: #f1f1f1;
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.1px;
      }
      .sub {
        margin: 0 0 14px;
        color: #909090;
        font-size: 11.5px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        cursor: pointer;
      }
      fieldset {
        margin: 10px 0 0;
        padding: 4px 10px 8px;
        border: 1px solid #272727;
        border-radius: 8px;
      }
      legend {
        padding: 0 4px;
        color: #909090;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      .option {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 6px 0;
        cursor: pointer;
      }
      .option small {
        display: block;
        color: #909090;
        font-size: 11px;
        line-height: 1.35;
        margin-top: 1px;
      }
      .speeds {
        display: flex;
        gap: 14px;
        padding: 4px 0 2px;
      }
      .speeds label {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      input[type="checkbox"],
      input[type="radio"] {
        margin: 2px 0 0;
        accent-color: #f00;
      }
      .hint {
        margin: 12px 0 0;
        color: #909090;
        font-size: 11px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="extName"></h1>
    <p class="sub" data-i18n="tagline"></p>

    <label class="row">
      <input type="checkbox" id="enabled" />
      <span data-i18n="enabled"></span>
    </label>

    <fieldset>
      <legend data-i18n="modeLegend"></legend>
      <label class="option">
        <input type="radio" name="mode" value="step" />
        <span>
          <span data-i18n="modeStepTitle"></span>
          <small data-i18n="modeStepHint"></small>
        </span>
      </label>
      <label class="option">
        <input type="radio" name="mode" value="flow" />
        <span>
          <span data-i18n="modeFlowTitle"></span>
          <small data-i18n="modeFlowHint"></small>
        </span>
      </label>
    </fieldset>

    <fieldset>
      <legend data-i18n="speedLegend"></legend>
      <div class="speeds">
        <label><input type="radio" name="speed" value="240" /><span data-i18n="speedFast"></span></label>
        <label><input type="radio" name="speed" value="420" /><span data-i18n="speedNormal"></span></label>
        <label><input type="radio" name="speed" value="620" /><span data-i18n="speedSoft"></span></label>
      </div>
    </fieldset>

    <p class="hint" data-i18n="hint"></p>

    <script src="popup.js"></script>
  </body>
</html>
