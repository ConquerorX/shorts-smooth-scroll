<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Shorts fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0f0f0f;
      }
      ytd-shorts {
        display: block;
        height: 100%;
      }
      /* Gerçek yapı (canlı DOM'dan alındı):
         #shorts-container (scroll + snap)
           > #shorts-inner-container (overflow visible)
             > div.reel-video-in-sequence-new  <-- sayfa boyu öğeler
                 > div#reel-overlay-container > ytd-reel-video-renderer */
      #shorts-container {
        height: 100%;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
      }
      #shorts-inner-container {
        display: block;
      }
      .template-holder {
        height: 0;
        overflow: hidden;
      }
      .reel-video-in-sequence-new {
        display: block;
        height: 100vh;
        scroll-snap-align: start;
        position: relative;
      }
      #reel-overlay-container,
      ytd-reel-video-renderer {
        display: block;
        height: 100%;
      }
      .card {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 600 42px/1 system-ui, sans-serif;
      }
      .comments {
        position: absolute;
        right: 24px;
        bottom: 24px;
        width: 240px;
        height: 160px;
        overflow-y: auto;
        background: #1c1c1c;
        color: #ccc;
        border-radius: 12px;
        font: 13px/1.4 system-ui, sans-serif;
      }
      .comments p {
        margin: 0;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <ytd-shorts>
      <div id="shorts-container">
        <div id="shorts-inner-container"></div>
      </div>
    </ytd-shorts>

    <script>
      (function () {
        const inner = document.getElementById('shorts-inner-container');

        // YouTube'un baştaki sıfır yükseklikli template yer tutucuları
        const placeholder = document.createElement('div');
        placeholder.className = 'template-holder';
        placeholder.innerHTML = '<template></template>';
        inner.appendChild(placeholder);

        for (let i = 0; i < 12; i++) {
          const sequence = document.createElement('div');
          sequence.className = 'reel-video-in-sequence-new style-scope ytd-shorts';
          sequence.id = String(i);

          if (i === 0) {
            // Gerçek DOM'da ytd-reel-video-renderer sadece aktif videonun
            // içinde bulunuyor; eklenti buna bağımlı olmamalı.
            const overlay = document.createElement('div');
            overlay.id = 'reel-overlay-container';
            const renderer = document.createElement('ytd-reel-video-renderer');
            renderer.innerHTML = '<div class="card">Short 1</div>';

            const comments = document.createElement('div');
            comments.className = 'comments';
            comments.id = 'comments';
            let html = '';
            for (let c = 0; c < 20; c++) html += '<p>yorum ' + (c + 1) + '</p>';
            comments.innerHTML = html;
            renderer.appendChild(comments);

            overlay.appendChild(renderer);
            sequence.appendChild(overlay);
          } else {
            sequence.innerHTML = '<div class="card">Short ' + (i + 1) + '</div>';
          }

          inner.appendChild(sequence);
        }
      })();
    </script>

    <script src="../src/core.js"></script>
    <script src="../src/content.js"></script>
  </body>
</html>
